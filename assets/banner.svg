<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Mikolaj Sitek — Full-stack developer">
  <title>Mikołaj Sitek — Full-stack developer</title>

  <defs>
    <!-- tło -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>

    <!-- gradient imienia: przesuwa się w kółko -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="35%"  stop-color="#a78bfa"/>
      <stop offset="70%"  stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0; -1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity=".50"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>

    <!-- siatka -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#233047" stroke-width="1" stroke-opacity=".55"/>
    </pattern>

    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="340" fill="url(#gridFade)"/></mask>

    <filter id="soft"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- maski „pisania" dla trzech linii -->
    <clipPath id="clip0"><rect x="62" y="176" height="40" width="0">
      <animate attributeName="width" values="0;404;404;0;0" keyTimes="0;.117;.300;.333;1"
               dur="12s" begin="0s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip1"><rect x="62" y="176" height="40" width="0">
      <animate attributeName="width" values="0;447;447;0;0" keyTimes="0;.117;.300;.333;1"
               dur="12s" begin="4s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip2"><rect x="62" y="176" height="40" width="0">
      <animate attributeName="width" values="0;504;504;0;0" keyTimes="0;.117;.300;.333;1"
               dur="12s" begin="8s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <!-- ===== tło ===== -->
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- pływające plamy światła -->
  <g filter="url(#soft)">
    <circle cx="200" cy="90" r="150" fill="url(#blobA)">
      <animate attributeName="cx" values="200;340;170;200" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;180;120;90"  dur="21s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="250" r="170" fill="url(#blobB)">
      <animate attributeName="cx" values="980;840;1030;980" dur="23s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="250;140;230;250"  dur="19s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="330" r="150" fill="url(#blobC)">
      <animate attributeName="cx" values="620;760;520;620" dur="27s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== imię ===== -->
  <text x="60" y="120" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="66" font-weight="800" letter-spacing="-1.5" fill="url(#nameGrad)">
    Mikołaj Sitek
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>

  <text x="62" y="156" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="600" fill="#8b98ad" letter-spacing="4.5">
    FULL-STACK DEVELOPER
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;.35;1" dur="1.6s" fill="freeze"/>
  </text>

  <!-- ===== linia „pisana" ===== -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="24" fill="#e6edf3">
    <g clip-path="url(#clip0)"><text x="62" y="205">React · Next.js · TypeScript</text></g>
    <g clip-path="url(#clip1)"><text x="62" y="205">Node.js · REST APIs · databases</text></g>
    <g clip-path="url(#clip2)"><text x="62" y="205">AI shipped to production, not demos</text></g>
  </g>

  <!-- kursor -->
  <rect y="182" width="12" height="28" rx="2" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="x" values="66;470;470;66;66" keyTimes="0;.117;.300;.333;1"
             dur="12s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="x" values="66;513;513;66;66" keyTimes="0;.117;.300;.333;1"
             dur="12s" begin="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="66;570;570;66;66" keyTimes="0;.117;.300;.333;1"
             dur="12s" begin="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;.45;.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== liczby ===== -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <g transform="translate(60 262)">
      <text font-size="30" font-weight="800" fill="#38bdf8">9</text>
      <text x="24" y="0" font-size="15" fill="#8b98ad">commercial projects</text>
      <animate attributeName="opacity" values="0;1" begin="1.2s" dur=".6s" fill="freeze"/>
    </g>
    <g transform="translate(280 262)">
      <text font-size="30" font-weight="800" fill="#a78bfa">1</text>
      <text x="22" y="0" font-size="15" fill="#8b98ad">Android app · paying users</text>
      <animate attributeName="opacity" values="0;1" begin="1.45s" dur=".6s" fill="freeze"/>
    </g>
    <g transform="translate(560 262)">
      <text font-size="30" font-weight="800" fill="#f472b6">1</text>
      <text x="22" y="0" font-size="15" fill="#8b98ad">custom CMS, built from scratch</text>
      <animate attributeName="opacity" values="0;1" begin="1.7s" dur=".6s" fill="freeze"/>
    </g>
  </g>

  <!-- ===== chipy technologiczne ===== -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="13" fill="#c3cddc">
    <g transform="translate(840 240)" opacity="0">
      <rect width="104" height="30" rx="15" fill="#161f31" stroke="#2b3a55"/>
      <text x="52" y="20" text-anchor="middle">TypeScript</text>
      <animate attributeName="opacity" values="0;1" begin="1.9s" dur=".5s" fill="freeze"/>
    </g>
    <g transform="translate(954 240)" opacity="0">
      <rect width="82" height="30" rx="15" fill="#161f31" stroke="#2b3a55"/>
      <text x="41" y="20" text-anchor="middle">Next.js</text>
      <animate attributeName="opacity" values="0;1" begin="2.05s" dur=".5s" fill="freeze"/>
    </g>
    <g transform="translate(1046 240)" opacity="0">
      <rect width="94" height="30" rx="15" fill="#161f31" stroke="#2b3a55"/>
      <text x="47" y="20" text-anchor="middle">Node.js</text>
      <animate attributeName="opacity" values="0;1" begin="2.2s" dur=".5s" fill="freeze"/>
    </g>
    <g transform="translate(840 280)" opacity="0">
      <rect width="104" height="30" rx="15" fill="#161f31" stroke="#2b3a55"/>
      <text x="52" y="20" text-anchor="middle">React Native</text>
      <animate attributeName="opacity" values="0;1" begin="2.35s" dur=".5s" fill="freeze"/>
    </g>
    <g transform="translate(954 280)" opacity="0">
      <rect width="82" height="30" rx="15" fill="#161f31" stroke="#2b3a55"/>
      <text x="41" y="20" text-anchor="middle">NestJS</text>
      <animate attributeName="opacity" values="0;1" begin="2.5s" dur=".5s" fill="freeze"/>
    </g>
    <g transform="translate(1046 280)" opacity="0">
      <rect width="94" height="30" rx="15" fill="#161f31" stroke="#2b3a55"/>
      <text x="47" y="20" text-anchor="middle">PostgreSQL</text>
      <animate attributeName="opacity" values="0;1" begin="2.65s" dur=".5s" fill="freeze"/>
    </g>
  </g>

  <!-- dolna linia świetlna -->
  <rect x="0" y="336" width="1200" height="4" fill="url(#nameGrad)" opacity=".9"/>
</svg>
